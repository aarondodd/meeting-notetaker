<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MN OWA Probe</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        margin: 8px;
        width: 280px;
      }
      .row { margin-bottom: 6px; }
      .label { color: #666; }
      .value { font-family: ui-monospace, monospace; }
      .ok { color: #1f7a1f; }
      .bad { color: #aa2020; }
      button { width: 100%; margin-top: 4px; padding: 4px; }
      .hint { color: #888; font-size: 11px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h3 style="margin: 0 0 6px 0;">OWA Calendar Probe</h3>
    <div class="row">
      <span class="label">Extension:</span>
      <span class="value" id="ext-version">-</span>
    </div>
    <div class="row">
      <span class="label">Native host:</span>
      <span class="value" id="conn-state">checking...</span>
    </div>
    <button id="fetch-now">Fetch today's calendar</button>
    <div class="hint">
      Requires an open / signed-in outlook.office.com tab. Result lands
      in the relay app, not here. Check the relay's log tail.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
